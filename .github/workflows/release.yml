name: Release

permissions: read-all

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'inttegro/inttegro-sdk-python'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    env:
      INTTEGRO_OPENAPI_SPEC: openapi/commerce.yml
    permissions:
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the OpenAPI contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: inttegro/openapi
          ref: 8697c9fff49f78d740d968bc6df184d24f4a61a4
          path: openapi
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify the release tag and package versions
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["tool"]["poetry"]["version"])')"
          runtime_version="$(python -c 'import runpy; print(runpy.run_path("src/inttegro/version.py")["VERSION"])')"
          test "${GITHUB_REF_NAME}" = "v${package_version}"
          test "${runtime_version}" = "${package_version}"
          test "$(git rev-list -n 1 "${GITHUB_REF_NAME}")" = "${GITHUB_SHA}"

      - name: Install the locked build environment
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements-bootstrap.txt
          poetry sync --with dev --no-interaction

      - name: Test and build
        run: |
          poetry run python scripts/generate_async_resources.py --check
          poetry run mypy src
          poetry run pyright
          poetry run python -m unittest discover -s tests -p "test_*.py"
          poetry build

      - name: Inspect the distributions
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l | tr -d ' ')" = "1"
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l | tr -d ' ')" = "1"

      - name: Attest the distributions
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

      - name: Record release provenance and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp dist/*.whl dist/*.tar.gz artifacts/
          cp "${{ steps.attest.outputs.bundle-path }}" artifacts/ATTESTATIONS.sigstore
          {
            echo "repository=https://github.com/${GITHUB_REPOSITORY}"
            echo "tag=${GITHUB_REF_NAME}"
            echo "commit=${GITHUB_SHA}"
            echo "workflow=${GITHUB_WORKFLOW_REF}"
          } > artifacts/PROVENANCE.txt
          (
            cd artifacts
            sha256sum ./*.whl ./*.tar.gz ./ATTESTATIONS.sigstore ./PROVENANCE.txt > SHA256SUMS
          )

      - name: Create the draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" artifacts/*
          --draft
          --generate-notes
          --title "Inttegro Python SDK ${GITHUB_REF_NAME}"
          --verify-tag

      - name: Publish the exact distributions to PyPI with OIDC
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          attestations: true
          print-hash: true
          verbose: true

      - name: Finalize the immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false
