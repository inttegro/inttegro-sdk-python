name: Python SDK CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      INTTEGRO_OPENAPI_SPEC: openapi/commerce.yml
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout OpenAPI contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: inttegro/openapi
          ref: 69a9c0257b44389ccd54c0946fdbe7745c266336
          path: openapi
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-bootstrap.txt

      - name: Install dependencies
        run: poetry sync --no-interaction

      - name: Run tests
        run: |
          poetry run python scripts/generate_async_resources.py --check
          poetry run mypy src
          poetry run mypy --disallow-any-expr tests/typecheck
          poetry run pyright
          poetry run pyright --verifytypes inttegro --ignoreexternal | tee /tmp/inttegro-verifytypes.txt
          grep -q "Type completeness score: 100%" /tmp/inttegro-verifytypes.txt
          poetry run coverage run -m unittest discover -s tests -p "test_*.py"
          poetry run coverage xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          file: coverage.xml
          flags: python
          name: python-sdk
