[tool.poetry]
name = "inttegro"
version = "10.0.0"
description = "Official Python SDK for the Inttegro API"
authors = ["Inttegro Engineering <engineering@inttegro.com>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "inttegro", from = "src" }]

[tool.poetry.urls]
Homepage = "https://studio.inttegro.com"
Repository = "https://github.com/inttegro/inttegro-sdk-python"
Issues = "https://github.com/inttegro/inttegro-sdk-python/issues"
Documentation = "https://python.inttegro.dev/"

[tool.poetry.dependencies]
python = ">=3.10"
opentelemetry-api = ">=1.27,<2"
httpx = ">=0.28,<1"

[tool.poetry.group.dev.dependencies]
coverage = "^7.6.1"
mypy = "2.3.1"
pyright = "1.1.411"
opentelemetry-sdk = "^1.44.0"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true

[build-system]
requires = ["poetry-core==2.4.1"]
build-backend = "poetry.core.masonry.api"
